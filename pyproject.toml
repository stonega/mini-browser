[project]
name = "mini-browser"
version = "0.1.0"
description = "A small, native GNOME browser. One page, one portrait window."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/mini_browser/gtk.py" = ["E402"]
